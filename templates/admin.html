<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin · Two Rooms and a Boom</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="admin">
  <header class="admin-header">
    <h1>💣 Game Master</h1>
    <div class="admin-status">
      <span id="phase-pill" class="pill">—</span>
      <span id="round-pill" class="pill">—</span>
      <span id="clock" class="pill clock">--:--</span>
    </div>
  </header>

  <main class="admin-grid">
    <section class="card">
      <h2>Setup</h2>
      <div id="setup"></div>
    </section>

    <section class="card">
      <h2>Round control</h2>
      <div id="controls"></div>
    </section>

    <section class="card wide">
      <h2>Players <span id="counts" class="muted small"></span></h2>
      <div id="players"></div>
    </section>

    <section class="card wide" id="result-card" style="display:none">
      <h2>Result</h2>
      <div id="result"></div>
    </section>
  </main>

  <script src="{{ url_for('static', filename='js/socket.io.min.js') }}"></script>
  <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
</body>
</html>
